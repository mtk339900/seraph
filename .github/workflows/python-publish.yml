name: Publish Seraph to PyPI

on:
  release:
    types: [published]  # triggers only when a GitHub Release is published

# Minimal permissions at the top level — each job declares only what it needs
permissions:
  contents: read

jobs:

  # ── 1. Run tests before publishing ──────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true   # abort all matrix jobs if one fails
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install seraph itself in editable mode (no extra deps required)
          pip install -e .

      - name: Run test suite
        run: pytest tests/ -v --tb=short

  # ── 2. Build source dist + wheel ────────────────────────────────────────────
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test   # only build if ALL test matrix jobs passed

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # build on latest stable

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Verify version matches release tag
        # Prevents accidental publishes where setup.py version ≠ git tag
        run: |
          PKG_VERSION=$(python -c "import seraph; print(seraph.__version__)")
          TAG_VERSION="${{ github.event.release.tag_name }}"
          # Strip leading 'v' from tag if present (v1.0.0 → 1.0.0)
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Package version : $PKG_VERSION"
          echo "Release tag     : $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: version mismatch — bump __version__ in seraph/__init__.py"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build
        # Produces:
        #   dist/seraph-X.Y.Z.tar.gz   ← source distribution
        #   dist/seraph-X.Y.Z-py3-none-any.whl  ← wheel

      - name: Verify distributions are non-empty
        run: |
          ls -lh dist/
          [ $(ls dist/ | wc -l) -ge 2 ] || (echo "ERROR: expected sdist + wheel" && exit 1)

      - name: Upload distributions as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 1   # only needed until the publish step picks them up

  # ── 3. Publish to PyPI via Trusted Publishing ────────────────────────────────
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build   # only publish if build (and therefore tests) passed

    permissions:
      id-token: write   # required for OIDC trusted publishing (no API token needed)

    environment:
      name: pypi
      url: https://pypi.org/project/seraph/${{ github.event.release.tag_name }}

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Trusted Publishing is used — NO api_token secret needed.
          # Set it up once at: https://pypi.org/manage/project/seraph/settings/publishing/
          # Add a "pending publisher" with:
          #   Owner      : mtk339900
          #   Repository : seraph
          #   Workflow   : python-publish.yml
          #   Environment: pypi
